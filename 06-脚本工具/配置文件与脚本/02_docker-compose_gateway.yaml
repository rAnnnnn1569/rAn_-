  # =============================================================================
# 运维注意事项（未写入代码，但非常重要）：
# =============================================================================
# 1. 端口冲突风险：
#    所有服务均使用 network_mode: host，如果未来启用多个转发服务，
#    必须确保每个容器内监听的端口不同（如 transmiterGXzf 用 9091，
#    transmiterSichuan 用 9092），否则容器启动会因端口占用失败。
#
# 2. 挂载目录依赖：
#    source 指定的宿主机目录必须存在且包含完整的发布文件（DLL 和配置），
#    否则容器会因找不到入口 DLL 而一直重启（CrashLoopBackOff）。
#
# 3. 配置文件管理：
#    JT809TransmitterService.dll 被多个服务共用，说明各地区配置
#    通过 appsettings.json 或环境变量区分，需确保每个地区的配置文件
#    正确配置了上级平台的 IP、端口、接入码、加密密钥（M1/IA1/IC1）。
#
# 4. 启动顺序依赖：
#    虽然 pserver 和 gxzfServer 都是 host 网络模式，但如果有依赖关系
#    （如转发服务需要网关的鉴权），需通过健康检查或外部脚本控制启动顺序。
#
# 5. 日志轮转：
#    当前仅限制了 max-size: 100m，未设置 max-file，建议配合 logrotate
#    或 Docker 全局日志配置，防止日志文件无限堆积。
# =============================================================================