  server { #业务服务器
        listen       8800;
        server_name  iot.zwbd.com.cn;
	#仅限该域名可以访问
	if ( $host != 'iot.zwbd.com.cn'){
		return 403; #安全防盗链,如果有人用 IP 地址（如 http://192.168.0.10:8800）
    或者其他域名绑定了服务器 IP 来访问，Nginx 直接返回 403 Forbidden。
	}

  location / {
            proxy_pass https://bd.zwbds.com:8082;
        }
	location /Cgo8 {
	    proxy_pass http://bd.zwbds.com:8088/Cgo8;
	}

    }
    server { #处理文件/附件服务器
	listen	7888; 
	server_name iot.zwbd.com.cn;
	location /Cgo8Attach/TopAttachFile/ {
  #降低业务服务器压力，转发到华为的OBS
		proxy_pass https://zwbdlkywvideo.obs.cn-southwest-2.myhuaweicloud.com/8/;
	}
    }	